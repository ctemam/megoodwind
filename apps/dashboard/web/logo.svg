  <text x="120" y="38" text-anchor="middle"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="34" font-weight="700" letter-spacing="1">
    <tspan fill="#FFFFFF">All</tspan><tspan fill="#4F8FF7">Bright</tspan>
  </text>
</svg>
