<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AllBright</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="./vendor/tailwind.js"></script>
  <script src="./vendor/react.min.js"></script>
  <script src="./vendor/react-dom.min.js"></script>
  <style>
    /* Metallic cockpit — gunmetal/silver industrial grade + glow values */
    :root { --bg:#000000; --line:#2E2E2E; --hair:#1A1A1A; --fg:#FFFFFF; --dim:#A3A3A3; --acc:#34D399; --cyan:#22D3EE; --warn:#FFB224; --bad:#F87171; }
    * { border-radius:0 !important; }
    html,body { background:var(--bg); color:var(--fg); font-family:'JetBrains Mono',ui-monospace,monospace; }
    .hairline { border:1px solid var(--hair); }
    .hairline-b { border-bottom:1px solid var(--hair); }
    .dim { color:var(--dim); }
    .warn { color:var(--warn); }
    /* brushed-metal surfaces — sidebar, ribbon, fold headers */
    .metallic {
      background: linear-gradient(180deg, #262626 0%, #141414 55%, #000000 100%);
      border-right: 1px solid rgba(255,255,255,.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 0 rgba(0,0,0,.7);
    }
    .metallic-head {
      background: linear-gradient(180deg, #262626 0%, #141414 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
      border-bottom: 1px solid var(--hair);
    }
    /* zebra striping — black / white layers */
    table tbody tr:nth-child(odd) { background: #000000; }
    table tbody tr:nth-child(even) { background: rgba(255,255,255,.045); }
    table tbody tr:hover { background: rgba(255,255,255,.10); }
    /* eye-catching value fonts — glow per semantic weight */
    .acc { color:var(--acc); font-weight:800; letter-spacing:.05em; text-shadow:0 0 6px rgba(52,211,153,.35); }
    .bad { color:var(--bad); font-weight:800; letter-spacing:.05em; text-shadow:0 0 6px rgba(248,113,113,.35); }
    .num { color:var(--cyan); font-weight:800; letter-spacing:.05em; text-shadow:0 0 6px rgba(34,211,238,.3); }
    /* micro-dot status */
    .dot { display:inline-block; width:6px; height:6px; border-radius:50%; }
    .dot.live { background:var(--acc); box-shadow:0 0 6px rgba(52,211,153,.7); }
    .dot.dead { background:var(--bad); box-shadow:0 0 6px rgba(248,113,113,.7); }
    .dot.armed { background:var(--warn); box-shadow:0 0 6px rgba(255,178,36,.7); }
    /* tooltip — heavy metadata lives here, never in the layout */
    .tt { position:relative; cursor:default; }
    .tt:hover::after {
      content:attr(data-tt); position:absolute; left:0; top:100%; z-index:50;
      background:#141414; border:1px solid var(--line); color:var(--dim);
      padding:6px 8px; font-size:10px; line-height:1.5; white-space:pre;
      min-width:180px; pointer-events:none; font-weight:400; letter-spacing:0; text-shadow:none;
    }
    ::-webkit-scrollbar { width:6px; height:6px; } ::-webkit-scrollbar-thumb { background:var(--line); }
    ::selection { background:var(--cyan); color:#000; }
    /* global +20% font scale — overrides px-based utility classes */
    #root .text-\[9px\]  { font-size:10.8px !important; }
    #root .text-\[10px\] { font-size:12px !important; }
    #root .text-\[11px\] { font-size:13.2px !important; }
    #root .text-\[12px\] { font-size:14.4px !important; }
    #root .text-lg       { font-size:21.6px !important; line-height:28.8px !important; }
    #root button, #root input, #root select { font-size:12px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./app.js?v=4"></script>
</body>
</html>
