[profile.default]
src = "contracts"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
eth = "${ETH_RPC_URL}"
bsc = "${BSC_RPC_URL}"
poly = "${POLY_RPC_URL}"
arb = "${ARB_RPC_URL}"
op = "${OP_RPC_URL}"
avax = "${AVAX_RPC_URL}"
base = "${BASE_RPC_URL}"
linea = "${LINEA_RPC_URL}"
scroll = "${SCROLL_RPC_URL}"
blast = "${BLAST_RPC_URL}"
