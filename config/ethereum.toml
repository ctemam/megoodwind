[chain]
chain_id = 1
name = "Ethereum"
rpc_https = ""
rpc_https_pool = [
    "https://ethereum-rpc.publicnode.com",
    "https://eth.drpc.org",
    "https://rpc.mevblocker.io",
]
rpc_wss = "wss://eth.drpc.org"
rpc_wss_pool = [
    "wss://ethereum-rpc.publicnode.com",
    "wss://eth.drpc.org",
]
trader_rpc = ""
# No executor/reader deployed on Ethereum — scan/measure mode.
arb_contract = "0x70DD16A8dA1639fc734d3AA0765436D8dBaeccC3"
state_reader = "0x0000000000000000000000000000000000000000"
block_time_ms = 12000
scan_budget_ms = 2500
call_deadline_ms = 1500

[wallet]
private_key_env = "PRIVATE_KEY"

[scanner]
flash_tokens = ["USDC", "USDT", "WETH", "DAI"]
min_profit_bps = 1
min_initial_bps = 2
optimization_iterations = 30
dry_run = false  # executor deployed + pimlico strict_4337 armed
[scanner.flash_amounts]
USDC = 10000000
USDT = 10000000
WETH = 4000000000000000
DAI  = 5000000000000000000
[scanner.flash_bounds.USDC]
min = 1000000
max = 100000000000
[scanner.flash_bounds.USDT]
min = 1000000
max = 100000000000
[scanner.flash_bounds.WETH]
min = 100000000000000
max = 1000000000000000000
[scanner.flash_bounds.DAI]
min = 1000000000000000000
max = 9000000000000000000

[gate]
min_profit_usd = 0.05
safety_margin_bps = 10
stable_pool_extra_margin_bps = 5

[submission]
# Execution via sponsored ERC-4337 UserOps (Pimlico) — same venue as BSC.
direct_fallback = false
pimlico_enabled = true
pimlico_bundler_url  = "https://api.pimlico.io/v2/ethereum/rpc?apikey=${PIMLICO_API_KEY}"
sponsor_policy_id_env = "ALLBRIGHTA_SPONSOR_POLICY_ID"
strict_4337 = true  # executor OWNER is the Pimlico smart account — all execution via sponsored UserOps

