[chain]
chain_id = 1
name = "Ethereum"
rpc_https = ""
rpc_https_pool = [
    "https://ethereum-rpc.publicnode.com",
    "https://eth.drpc.org",
    "https://ethereum.publicnode.com",
    "https://eth.llamarpc.com",
    "https://1rpc.io/eth",
    "https://rpc.ankr.com/eth",
    "https://ethereum.blockpi.network/v1/rpc/public",
    "https://eth.merkle.io",
    "https://cloudflare-eth.com",
    "https://rpc.mevblocker.io",
    "https://endpoints.omniatech.io/v1/eth/mainnet/public",
]
rpc_wss = ""
rpc_wss_pool = [
    "wss://ethereum-rpc.publicnode.com",
    "wss://eth.drpc.org",
]
trader_rpc = ""
# No executor/reader deployed on Ethereum — scan/measure mode.
# dry_run MUST stay true until a contract is deployed.
arb_contract = ""
state_reader = "0x0000000000000000000000000000000000000000"
block_time_ms = 12000
scan_budget_ms = 2500

[wallet]
private_key_env = "PRIVATE_KEY"

[scanner]
flash_tokens = ["USDC", "USDT", "WETH", "DAI"]
min_profit_bps = 1
min_initial_bps = 2
optimization_iterations = 30
dry_run = true   # scan/measure only — no executor on this chain
[scanner.flash_amounts]
USDC = 10000000
USDT = 10000000
WETH = 4000000000000000
DAI  = 5000000000000000000
[scanner.flash_bounds.USDC]
min = 1000000
max = 100000000000
[scanner.flash_bounds.USDT]
min = 1000000
max = 100000000000
[scanner.flash_bounds.WETH]
min = 100000000000000
max = 1000000000000000000
[scanner.flash_bounds.DAI]
min = 1000000000000000000
max = 9000000000000000000

[gate]
min_profit_usd = 0.05
safety_margin_bps = 10
stable_pool_extra_margin_bps = 5

[submission]
# Ethereum backruns need a bundle venue (Flashbots-style eth_sendBundle) —
# not yet implemented; this chain measures detection only.
direct_fallback = false
pimlico_enabled = false
strict_4337 = false

[token_usd_prices]
USDC = 1.0
USDT = 1.0
DAI  = 1.0
WETH = 2600.0   # approximate snapshot — CMC drift alert watches deviation
WBTC = 62000.0

[tokens]
WETH = "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
USDC = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
USDT = "0xdAC17F958D2ee523a2206206994597C13D831ec7"
DAI  = "0x6B175474E89094C44Da98b954EedeAC495271d0F"
WBTC = "0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599"

[scanner.paths]
max_hops = 4
max_paths_per_flash_token = 25000
max_paths_through_token = 200

[circuit_breaker]
token_revert_threshold = 5
token_suppression_blocks = 200

[pricing]
thin_pool_threshold_usd = 50000
cmc_drift_alert_pct = 25.0
refresh_blocks = 100

