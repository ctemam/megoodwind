[chain]
chain_id = 137
name = "Polygon"
rpc_https = ""
rpc_https_pool = [
    "https://polygon-bor-rpc.publicnode.com",
    "https://polygon.drpc.org",
    "https://polygon.publicnode.com",
    "https://polygon.rpc.thirdweb.com",
    "https://polygon.gateway.tenderly.co",
]
rpc_wss = "wss://polygon-bor-rpc.publicnode.com"
rpc_wss_pool = [
    "wss://polygon-bor-rpc.publicnode.com",
    "wss://polygon.drpc.org",
]
trader_rpc = ""
# No executor/reader deployed on Polygon — scan/measure mode.
# Executor is deployed and strict_4337 armed — dry_run=false is live-authorized.
# UniV4 PoolManager on Polygon. Same semantics as BSC (see config/bsc.toml).
# v4_pool_manager = "0x67366782805870060151383F4BbFF9daB53e5cD6"
arb_contract = "0xe4286046a9d739Cdb61Fb5a7ad3e72361BF7d277"
state_reader = "0xec3d37cd945bf2a6a6d2712e56c688a08273e7a2"
block_time_ms = 2000
scan_budget_ms = 1200
call_deadline_ms = 900  # lightened batches (MC3_MAX_CALLS=30) answer well under this on healthy public endpoints

[wallet]
private_key_env = "PRIVATE_KEY"

[scanner]
flash_tokens = ["USDC", "USDT", "WPOL", "WETH"]
min_profit_bps = 1
min_initial_bps = 2
optimization_iterations = 30
dry_run = false  # executor deployed + pimlico strict_4337 armed
[scanner.flash_amounts]
USDC = 5000000
USDT = 5000000
WPOL = 5000000000000000000
WETH = 2000000000000000
[scanner.flash_bounds.USDC]
min = 1000000
max = 50000000000
[scanner.flash_bounds.USDT]
min = 1000000
max = 50000000000
[scanner.flash_bounds.WPOL]
min = 1000000000000000000
max = 9000000000000000000
[scanner.flash_bounds.WETH]
min = 100000000000000
max = 1000000000000000000

[gate]
min_profit_usd = 0.05
safety_margin_bps = 10
stable_pool_extra_margin_bps = 5

[submission]
# Execution via sponsored ERC-4337 UserOps (Pimlico) — same venue as BSC.
direct_fallback = false
pimlico_enabled = true
pimlico_bundler_url  = "https://api.pimlico.io/v2/polygon/rpc?apikey=${PIMLICO_API_KEY}"
sponsor_policy_id_env = "ALLBRIGHTA_SPONSOR_POLICY_ID"
strict_4337 = true  # executor OWNER is the Pimlico smart account — all execution via sponsored UserOps

[token_usd_prices]
USDC = 1.0
USDCe = 1.0
USDT = 1.0
DAI = 1.0
WPOL = 0.42   # approximate snapshot — CMC drift alert watches deviation
