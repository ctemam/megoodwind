[chain]
chain_id = 137
name = "Polygon"
rpc_https = ""
rpc_https_pool = [
    "https://polygon-bor-rpc.publicnode.com",
    "https://polygon.drpc.org",
    "https://polygon-mainnet.public.blastapi.io",
    "https://polygon.llamarpc.com",
    "https://1rpc.io/matic",
    "https://rpc.ankr.com/polygon",
    "https://endpoints.omniatech.io/v1/matic/mainnet/public",
    "https://polygon.rpc.subquery.network/public",
    "https://polygon.meowrpc.com",
    "https://polygon-rpc.com",
]
rpc_wss = ""
rpc_wss_pool = [
    "wss://polygon-bor-rpc.publicnode.com",
    "wss://polygon.drpc.org",
]
trader_rpc = ""
# No executor/reader deployed on Polygon — scan/measure mode.
# dry_run MUST stay true until a contract is deployed.
arb_contract = ""
state_reader = "0x0000000000000000000000000000000000000000"
block_time_ms = 2000
scan_budget_ms = 600

[wallet]
private_key_env = "PRIVATE_KEY"

[scanner]
flash_tokens = ["USDC", "USDT", "WPOL", "WETH"]
min_profit_bps = 1
min_initial_bps = 2
optimization_iterations = 30
dry_run = true   # scan/measure only — no executor on this chain
[scanner.flash_amounts]
USDC = 5000000
USDT = 5000000
WPOL = 5000000000000000000
WETH = 2000000000000000
[scanner.flash_bounds.USDC]
min = 1000000
max = 50000000000
[scanner.flash_bounds.USDT]
min = 1000000
max = 50000000000
[scanner.flash_bounds.WPOL]
min = 1000000000000000000
max = 9000000000000000000
[scanner.flash_bounds.WETH]
min = 100000000000000
max = 1000000000000000000

[gate]
min_profit_usd = 0.05
safety_margin_bps = 10
stable_pool_extra_margin_bps = 5

[submission]
# No builder/bundle venue exists on Polygon — backruns have no ordering
# guarantee; only venue-less detection is measured here.
direct_fallback = false
pimlico_enabled = false
strict_4337 = false

[token_usd_prices]
USDC = 1.0
USDCe = 1.0
USDT = 1.0
DAI = 1.0
WPOL = 0.42   # approximate snapshot — CMC drift alert watches deviation
WETH = 2600.0

[tokens]
USDC  = "0x3c499c542cEF5E3811e1192ce70d8cc03d5c3359"
USDCe = "0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174"
USDT  = "0xc2132D05D31c914a87C6611C10748AEb04B58e8F"
WETH  = "0x7ceB23fD6bC0adD59E62ac25578270cFf1b9f619"
WPOL  = "0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270"
DAI   = "0x8f3Cf7ad23Cd3CaDbD9735AFf958023239c6A063"

[scanner.paths]
max_hops = 4
max_paths_per_flash_token = 25000
max_paths_through_token = 200

[circuit_breaker]
token_revert_threshold = 5
token_suppression_blocks = 200

[pricing]
thin_pool_threshold_usd = 50000
cmc_drift_alert_pct = 25.0
refresh_blocks = 100

