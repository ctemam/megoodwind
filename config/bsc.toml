# Wallet intelligence: real-time top-wallet discovery (observation only).
# Enabled 2026-10-04 per Commander order — BSC is the live trading chain.
[leaders]
discover = true
# Wallet-copy execution lane — after-signal only, never front-running.
# "live" still requires each wallet's risk_tier = "live"; discovered
# wallets land at "observe" so nothing submits until a wallet is
# promoted. copy_usd is the fixed notional per copy.
copy_mode          = "off"
copy_usd           = 50.0
copy_slippage_bps  = 300
copy_deadline_secs = 120
# Discovered wallet crossing this score auto-promotes to live tier
# (candidate bar is discover_min_score=15; live bar set well above)
copy_promote_score  = 15.0
# PancakeSwap V2 + V1 routers (calldata-verified V2 shapes)
copy_v2_routers    = ["0x10ED43C718714eb63d5aA57B78B54704E256024E",
                      "0x05fF2B0DB69458A0750badebc4f9e13aDd608C7F"]
# WBNB, USDT, USDC — priced spend tokens the lane can source
copy_spend_tokens  = ["0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c",
                      "0x55d398326f99059fF775485246999027B3197955",
