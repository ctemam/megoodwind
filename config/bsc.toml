[chain]
chain_id = 56
name = "BSC"
rpc_https = "${BSC_RPC_URL}"
# Free read pool — latency-biased round-robin (EWMA pick), 60s blacklist on
# 429/timeout (spec §Network Resiliency). Pruned 2026-10-04 by latency_bench:
# dwellir fails every eth_call; blastapi + both 48.club bench >85ms p50.
rpc_https_pool = [
    "https://bsc-dataseed.binance.org",
    "https://bsc-dataseed.bnbchain.org",
    "https://bsc-mainnet.nodereal.io/v1/64a9df0874fb4a93b9d0a3849de012d3",
    "https://bsc-dataseed1.bnbchain.org",
    "https://binance.nodereal.io",
    "https://bsc-dataseed2.bnbchain.org",
    "https://bsc-dataseed4.bnbchain.org",
    "https://bsc-dataseed3.bnbchain.org",
    "https://bsc-dataseed2.binance.org",
    "https://bsc.rpc.blxrbdn.com",
    "https://bsc-dataseed3.ninicoin.io",
    "https://bsc-dataseed1.binance.org",
    "https://bsc-dataseed4.defibit.io",
    "https://bsc-dataseed1.defibit.io",
    "https://bsc-dataseed2.ninicoin.io",
    "https://bsc-dataseed4.ninicoin.io",
    "https://bsc-dataseed1.ninicoin.io",
    "https://bsc-dataseed3.defibit.io",
    "https://bsc-dataseed2.defibit.io",
    "https://bsc.blockrazor.xyz",
    "https://rpc.48.club",
]
rpc_wss = "wss://bsc-rpc.publicnode.com"
# Read deadline per multicall batch. Public BSC endpoints regularly exceed
# the 400ms default under concurrent batch load, causing timeout+retry churn
# (measured: ~3.2k timeouts/hr, rpc phase ~1.6s vs 800ms block budget).
call_deadline_ms = 2200
# WSS pool for mempool stream — cycled on failure/backpressure
rpc_wss_pool = [
    "wss://bsc-rpc.publicnode.com",
    "wss://bsc.publicnode.com",
    "wss://bsc.drpc.org",
]
# Private-orderflow pending-tx feeds (bloXroute BDN, Eden, proprietary
# relays). Same newPendingTransactions protocol; the watcher rotates these
# alongside the public pool. Uncomment + set BSC_MEMPOOL_WSS / BSC_MEMPOOL_AUTH
# in the environment — never commit a live key.
# private_mempool_wss = ["${BSC_MEMPOOL_WSS}"]
# private_mempool_auth = "${BSC_MEMPOOL_AUTH}"

trader_rpc = "${BSC_TRADER_NODE}"   # Warp-enabled, $0.15/call — ONLY for tx submission
# Uniswap V4 PoolManager on BSC — the arb contract's deployed immutable
# (verified on-chain: POOL_MANAGER() = 0x28e2...e9df). Required for [[pools]]
# v4 entries; also the PCS Infinity CLPoolManager is 0xa0FfB9c1CE1Fe56963B
# 0321B32E7A0302114058b (different singleton — swap/settle split with its
# Vault, NOT UniV4-monolithic, so do not point the contract's interface at it).
v4_pool_manager = "0x28e2Ea090877bF75740558f6BFB36A5fFee9e9dF"
# BscFlashArb deployed 2026-10-04 via sponsored CREATE2 UserOp (tx
# 0x69e1a01e83c430580e6b7e1accdbdc553bb52089c5426a07936f702f41633f28).
arb_contract = "0x2db918f9c7020950e5a7d9948b489b5322700626"
# StateReader deployed 2026-10-04 via sponsored CREATE2 UserOp on all three
# chains (same salt → same address).
state_reader = "0xec3d37cd945bf2a6a6d2712e56c688a08273e7a2"
block_time_ms = 3000
scan_budget_ms = 800

[wallet]
private_key_env = "PRIVATE_KEY"

[scanner]
flash_tokens = ["USDT", "USDC", "WBNB", "FDUSD"]
min_profit_bps = 1
min_initial_bps = 2
optimization_iterations = 30
dry_run = false  # Commander-authorized live submission: backruns via ordered builder bundles

[scanner.flash_amounts]
USDT = 5000000                # 5 USDT (6 dec) — known to find candidates
USDC = 5000000                # 5 USDC
WBNB = 10000000000000000      # 0.01 WBNB (~$6)
FDUSD = 5000000000000000000  # 5 FDUSD (18 dec)

[scanner.flash_bounds.USDT]
min = 1000000
max = 50000000000

[scanner.flash_bounds.USDC]
min = 1000000
max = 50000000000

[scanner.flash_bounds.WBNB]
min = 1000000000000000
max = 5000000000000000000

[gate]
min_profit_usd = 0.60
safety_margin_bps = 10
stable_pool_extra_margin_bps = 5

[submission]
# Builder venues (ordered bundles: [victim tx, backrun tx])
puissant_url    = "https://puissant-builder.48.club"
blockrazor_url  = "https://bsc.blockrazor.xyz"
jetbldr_url     = "https://rpc.bsc-virginia.jetbldr.xyz"
nodereal_url    = "https://bsc-mainnet-builder.nodereal.io"
blink_url       = ""
# Warp (Chainstack Trader) fires ONLY when projected profit exceeds this threshold.
# Each call costs $0.15 — keep this high.
warp_threshold_usd = 50.0
# Hard cap per runner session. Bot will terminate cleanly when reached.
warp_budget_usd    = 5.0
# DirectSubmitter uses the FREE Growth endpoint. Safe to enable, but skips MEV protection.
direct_fallback = false

# --- ERC-4337 gasless venue (allbrightA Account Abstraction Rule) ---
# Routes submissions as sponsored UserOperations through the Pimlico bundler.
pimlico_enabled      = true
pimlico_bundler_url  = "https://api.pimlico.io/v2/binance/rpc?apikey=${PIMLICO_API_KEY}"
sponsor_policy_id_env = "ALLBRIGHTA_SPONSOR_POLICY_ID"
# entry_point / account_factory default to canonical v0.6 addresses.
strict_4337          = true  # executor OWNER is the Pimlico smart account — all execution via sponsored UserOps (no victim-ordering bundles; BSC dislocations often persist >=1 block)

